[project]
name = "llm-spam-organizer"
version = "0.2.1"
description = "Move spam into the spam folder over IMAP using a local LLM served by Ollama"
readme = "README.md"
authors = [
    { name = "Martin Ueding", email = "mu@martin-ueding.de" }
]
requires-python = ">=3.14"
dependencies = [
    "html2text>=2025.4.15",
    "imap-tools>=1.15.0",
    "ollama>=0.6.2",
]

[project.scripts]
llm-spam-organizer = "llm_spam_organizer:main"

[project.optional-dependencies]
eval = [
    "matplotlib>=3.11.1",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.12.1",
    "pytest>=9.1.1",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
tag_format = "v$version"
