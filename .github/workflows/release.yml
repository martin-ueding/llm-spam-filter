name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"

      - run: uv sync --dev

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        id: cz
        run: |
          set +e
          uv run cz bump --changelog --yes
          code=$?
          set -e
          if [ "$code" -eq 21 ]; then
            echo "No release-worthy commits since the last tag."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push bump commit and tag
        if: steps.cz.outputs.bumped == 'true'
        run: git push --follow-tags origin HEAD:main

      - name: Create GitHub release
        if: steps.cz.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(uv run cz version --project)"
          awk '/^## /{if (n++) exit} n' CHANGELOG.md > release-notes.md
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file release-notes.md
